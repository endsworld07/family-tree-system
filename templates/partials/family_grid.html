<div class="tree-canvas">

    <!-- 連接線 -->
    <div class="line line-v-1"></div>
    <div class="line line-h-1"></div>

    <!-- 人員 -->
    {% for title, position in layout.items() %}
    <div
        class="person-box"
        style="left: {{ position.x }}px; top: {{ position.y }}px;">

        <div class="person-title">{{ title }}</div>

        <input
            type="text"
            name="{{ title }}"
            value="{{ family.get(title,'') }}"
            placeholder="姓名">

    </div>
    {% endfor %}

</div>
