<section class="summary-section">

    <h2 class="section-title">
        三、資料統計
    </h2>

    <div class="summary-panel">

        <div class="summary-item">

            <div class="summary-label">
                申請人
            </div>

            <div class="summary-value">

                {{ applicant }}

            </div>

        </div>

        <div class="summary-item">

            <div class="summary-label">
                已填寫親屬
            </div>

            <div class="summary-value">

                {{ family|length }}

                人

            </div>

        </div>

        <div class="summary-item">

            <div class="summary-label">
                未填寫親屬
            </div>

            <div class="summary-value">

                {% if layout is defined %}

                    {{ layout|length - family|length }}

                {% else %}

                    0

                {% endif %}

                人

            </div>

        </div>

        <div class="summary-item">

            <div class="summary-label">
                固定稱謂數
            </div>

            <div class="summary-value">

                {% if layout is defined %}

                    {{ layout|length }}

                {% else %}

                    0

                {% endif %}

                人

            </div>

        </div>

    </div>

</section>
