<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script src="https://unpkg.com/streamlit-component-lib@1.6.0/dist/index.js"></script>
  <style>
    html, body, #chart { margin: 0; padding: 0; width: 100%; }
    #chart svg { display: block; max-width: 100%; height: auto; }
    .person-link { cursor: pointer; }
    .person-link:hover .person-box { stroke: #2563eb; stroke-width: 1.4; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    const { Streamlit } = window.streamlitComponentLib;
    const chart = document.getElementById("chart");

    function updateHeight() {
      requestAnimationFrame(() => Streamlit.setFrameHeight(chart.scrollHeight));
    }

    function render(event) {
      chart.innerHTML = event.detail.args.svg || "";
      chart.querySelectorAll("[data-person-id]").forEach((node) => {
        node.addEventListener("click", () => {
          Streamlit.setComponentValue(node.dataset.personId);
        });
      });
      updateHeight();
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, render);
    Streamlit.setComponentReady();
  </script>
</body>
</html>
