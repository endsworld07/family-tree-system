<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    html, body, #chart { margin: 0; padding: 0; width: 100%; }
    #chart svg { display: block; max-width: 100%; height: auto; }
    .person-link { cursor: pointer; }
    .person-link:hover .person-box { stroke: #2563eb; stroke-width: 1.4; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    const chart = document.getElementById("chart");

    // This is the small public Streamlit component message protocol.  It is
    // implemented locally so the deployed chart has no CDN/network runtime
    // dependency.
    function sendMessage(type, payload = {}) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type,
        ...payload,
      }, "*");
    }

    function updateHeight() {
      requestAnimationFrame(() => {
        sendMessage("streamlit:setFrameHeight", {
          height: Math.max(chart.scrollHeight, chart.getBoundingClientRect().height),
        });
      });
    }

    function render(args) {
      chart.innerHTML = args.svg || "";
      chart.querySelectorAll("[data-person-id]").forEach((node) => {
        node.addEventListener("click", () => {
          sendMessage("streamlit:setComponentValue", { value: node.dataset.personId });
        });
      });
      updateHeight();
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        render(event.data.args || {});
      }
    });
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
